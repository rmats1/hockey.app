name: AHBA_Data_Sync_Runner

on:
  push:
    branches: [ "master" ]
  schedule:
    # Corre una vez al día (a las 03:00 AM UTC) para mantenimiento general
    - cron: '0 3 * * *'
    # Durante los fines de semana (Sábado y Domingo), corre cada 2 horas
    # de 10:00 AM a 22:00 PM UTC para capturar resultados en vivo.
    - cron: '0 10-22/2 * * 6,0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography supabase

      - name: Run synchronization script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/supabase_sync.py
